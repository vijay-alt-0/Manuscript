<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin><!-- V4 menu correction: collapse control is rightmost; collapsed state hides Stories, Sections, and utility controls while preserving draft timeline and editor title/actions. -->
</script>

<style>
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,textarea{font:inherit}
button{touch-action:manipulation}

@media print{
  body{background:#fff!important}
  body *{visibility:hidden!important}
  #root, #root *{visibility:visible!important}
  #root{height:auto!important;overflow:visible!important}
  #root > div{display:block!important;height:auto!important;overflow:visible!important}
  aside, header, button, textarea, input, .no-print{display:none!important}
  main{display:block!important;overflow:visible!important}
}
/* V4 FINAL MENU RULE: Session Timer is independent of collapse and remains visible. */
</style>


<style id="v4-session-timer-rule">.session-timer,.sessionTimer,[data-session-timer="true"]{display:flex!important;visibility:visible!important}</style>
</head>
<body>


<div id="root"><div style="padding:24px">Loading Manuscript…</div></div>

<script>
window.addEventListener("error",function(e){
  const root=document.getElementById("root");
  if(root&&!window.__manuscriptMounted){
    root.innerHTML='<div style="padding:24px;font-family:monospace;white-space:pre-wrap"><b>Could not load Manuscript.</b>\\n\\n'+
      (e.message||"Unknown error")+'</div>';
  }
});
</script>

<script type="text/babel" data-presets="react">
const {useState,useRef,useEffect}=React;

const uid=()=>Math.random().toString(36).slice(2,10);
const now=()=>Date.now();
const clone=o=>typeof structuredClone==="function"?structuredClone(o):JSON.parse(JSON.stringify(o));
const fmtTime=ts=>new Date(ts).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
const fmtShort=ts=>new Date(ts).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
const truncate=(s,n)=>s.length>n?s.slice(0,n).trimEnd()+"…":s;

const STORAGE_KEY="manuscript:stories";
const DARK_KEY="manuscript:dark";
const DAILY_KEY="manuscript:daily-stats";
const DB_NAME="ManuscriptDB";
const DB_VERSION=1;
const BACKUP_STORE="backups";
const STORY_STORE="stories";
const AUTO_BACKUP_LIMIT=15;
const AUTO_BACKUP_INTERVAL=20*60*1000;
const HISTORY_LIMIT=100;
const todayKey=()=>new Date().toISOString().slice(0,10);
const countWords=text=>{
  const s=String(text||"").trim();
  return s?s.split(/\s+/).length:0;
};
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORY_STORE))db.createObjectStore(STORY_STORE,{keyPath:"key"});if(!db.objectStoreNames.contains(BACKUP_STORE))db.createObjectStore(BACKUP_STORE,{keyPath:"id"});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function dbGet(store,key){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction(store,"readonly").objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function dbPut(store,obj){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction(store,"readwrite").objectStore(store).put(obj);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function dbAll(store){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction(store,"readonly").objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});}
async function dbDelete(store,key){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction(store,"readwrite").objectStore(store).delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
async function saveProjectIDB(stories){try{return await dbPut(STORY_STORE,{key:"current",stories});}catch(e){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(stories));return true;}catch(err){throw e;}}}
async function loadProjectIDB(){try{const r=await dbGet(STORY_STORE,"current");if(r?.stories?.order?.length)return r.stories;}catch(e){}try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const x=JSON.parse(raw);if(x?.order?.length){try{await dbPut(STORY_STORE,{key:"current",stories:x});}catch(e){}return x;}}}catch(e){}return null;}
async function createBackup(stories,reason){try{const b={id:uid(),timestamp:now(),reason,stories:clone(stories)};await dbPut(BACKUP_STORE,b);if(reason==="Auto-backup"){const autos=(await dbAll(BACKUP_STORE)).filter(x=>x.reason==="Auto-backup").sort((a,b)=>b.timestamp-a.timestamp);for(const old of autos.slice(AUTO_BACKUP_LIMIT))await dbDelete(BACKUP_STORE,old.id);}return b;}catch(e){return null;}}
function validateProject(x){return !!(x&&Array.isArray(x.order)&&x.byId&&x.order.every(id=>x.byId[id]?.sections&&x.byId[id]?.drafts));}
function exportProjectBackup(stories,label="manual"){download(JSON.stringify({format:"Manuscript Project Backup",version:5,exportedAt:now(),stories},null,2),`Manuscript_${label}_backup_${new Date().toISOString().replace(/[:.]/g,"-")}.json`,"application/json");}

const LIGHT={
  paper:"#FBFAF7",paperDim:"#F3F0E9",ink:"#1C1B19",inkSoft:"#5B5850",
  sienna:"#8B6F5C",siennaLight:"#EFE6DC",rule:"#DCD5C6",moss:"#4A5D52",
  danger:"#A14C3E"
};
const DARK={
  paper:"#191817",paperDim:"#242220",ink:"#F3F0E9",inkSoft:"#B7B1A7",
  sienna:"#C5A38B",siennaLight:"#332A24",rule:"#403B35",moss:"#8BA996",
  danger:"#D98778"
};

function seedStory(){
  const s1=uid(),s2=uid(),s3=uid();
  const v1a=uid(),v1b=uid(),v2a=uid(),v3a=uid(),d1=uid();
  const t0=now()-1000*60*60*24*3;
  return {
    id:uid(),title:"The Lighthouse Keeper's Debt",createdAt:t0,
    sections:{order:[s1,s2,s3],byId:{
      [s1]:{id:s1,name:"Opening",variants:{order:[v1a,v1b],byId:{
        [v1a]:{id:v1a,text:"The lighthouse had not gone dark in forty years, and Mira intended to keep it that way, debt collectors or no.",createdAt:t0,note:"First pass"},
        [v1b]:{id:v1b,text:"Mira counted the storm by its flashes: one, the bank's letter on the table; two, the empty oil drum; three, the light, still burning.",createdAt:t0+18000000,note:"Tried opening on an image instead of exposition"}
      }}},
      [s2]:{id:s2,name:"The Visitor",variants:{order:[v2a],byId:{
        [v2a]:{id:v2a,text:"A man in a wet coat climbed the spiral stairs and did not introduce himself before asking for the ledger.",createdAt:t0+72000000,note:"First pass"}
      }}},
      [s3]:{id:s3,name:"The Reveal",variants:{order:[v3a],byId:{
        [v3a]:{id:v3a,text:"The debt was never the bank's. It was her father's, and he had paid it in full the night he drowned.",createdAt:t0+108000000,note:"First pass"}
      }}}
    }},
    drafts:{order:[d1],byId:{
      [d1]:{id:d1,name:"Draft 1",createdAt:t0,selections:{[s1]:v1a,[s2]:v2a,[s3]:v3a}}
    }},
    activeDraftId:d1
  };
}

function makeNewStory(){
  const id=uid(),s=uid(),v=uid(),d=uid(),t=now();
  return {
    id,title:"Untitled Story",createdAt:t,
    sections:{order:[s],byId:{
      [s]:{id:s,name:"Opening",variants:{order:[v],byId:{
        [v]:{id:v,text:"",createdAt:t,note:"First pass"}
      }}}
    }},
    drafts:{order:[d],byId:{
      [d]:{id:d,name:"Draft 1",createdAt:t,selections:{[s]:v}}
    }},
    activeDraftId:d
  };
}

function StoryApp(){
  const [stories,setStories]=useState({order:[],byId:{}});
  const [activeStoryId,setActiveStoryId]=useState(null);
  const [activeSectionId,setActiveSectionId]=useState(null);
  const [view,setView]=useState("edit");
  const [sidebarOpen,setSidebarOpen]=useState(true);
  const [railOpen,setRailOpen]=useState(true);
  const [darkMode,setDarkMode]=useState(()=>localStorage.getItem(DARK_KEY)==="1");
  const [loaded,setLoaded]=useState(false);
  const [saveState,setSaveState]=useState("idle");
  const [backupOpen,setBackupOpen]=useState(false);
  const [backups,setBackups]=useState([]);
  const [searchOpen,setSearchOpen]=useState(false);
  const [dailyWords,setDailyWords]=useState(()=>{
    try{
      const raw=JSON.parse(localStorage.getItem(DAILY_KEY)||"null");
      return raw&&raw.date===todayKey()&&Number.isFinite(raw.words)?raw.words:0;
    }catch(e){return 0}
  });
  const timer=useRef(null);
  const C=darkMode?DARK:LIGHT;

  useEffect(()=>{(async()=>{
    try{const parsed=await loadProjectIDB();if(parsed){setStories(parsed);setActiveStoryId(parsed.order[0]);setLoaded(true);return;}}catch(e){}
    const s=seedStory(),x={order:[s.id],byId:{[s.id]:s}};
    try{await saveProjectIDB(x)}catch(e){}
    setStories(x);setActiveStoryId(s.id);setLoaded(true);
  })();},[]);

  useEffect(()=>{
    try{localStorage.setItem(DARK_KEY,darkMode?"1":"0")}catch(e){}
  },[darkMode]);

  useEffect(()=>{
    if(!loaded)return;
    setSaveState("saving");
    clearTimeout(timer.current);
    timer.current=setTimeout(()=>{
      try{saveProjectIDB(stories).then(()=>setSaveState("saved"));clearTimeout(window.__manuscriptBackupTimer);window.__manuscriptBackupTimer=setTimeout(async()=>{const key="manuscript_v4_last_auto_backup";const last=Number(localStorage.getItem(key)||0);const nowTs=Date.now();if(nowTs-last>=AUTO_BACKUP_INTERVAL){const b=await createBackup(stories,"Auto-backup");if(b){localStorage.setItem(key,String(nowTs));setBackups((await dbAll(BACKUP_STORE)).sort((a,b)=>b.timestamp-a.timestamp));}}},1000)}
      catch(e){setSaveState("error")}
    },350);
    return()=>clearTimeout(timer.current);
  },[stories,loaded]);

  useEffect(()=>{
    try{localStorage.setItem(DAILY_KEY,JSON.stringify({date:todayKey(),words:dailyWords}))}catch(e){}
  },[dailyWords]);

  useEffect(()=>{if(loaded)dbAll(BACKUP_STORE).then(x=>setBackups(x.sort((a,b)=>b.timestamp-a.timestamp))).catch(()=>{});},[loaded]);

  const recordWords=(delta)=>{
    const n=Math.max(0,Math.floor(Number(delta)||0));
    if(n)setDailyWords(v=>v+n);
  };

  const story=stories.byId[activeStoryId];

  useEffect(()=>{
    if(story){
      const valid=story.sections.order.includes(activeSectionId);
      if(!valid)setActiveSectionId(story.sections.order[0]||null);
    }
  },[story,activeSectionId]);

  const updateStory=fn=>{
    setStories(prev=>{
      if(!prev.byId[activeStoryId])return prev;
      const next={...prev,byId:{...prev.byId}};
      next.byId[activeStoryId]=fn(clone(next.byId[activeStoryId]));
      return next;
    });
  };

  const newStory=()=>{
    const s=makeNewStory();
    setStories(p=>({order:[...p.order,s.id],byId:{...p.byId,[s.id]:s}}));
    setActiveStoryId(s.id);setActiveSectionId(s.sections.order[0]);setView("edit");
  };

  const deleteStory=id=>{
    if(stories.order.length<=1)return;
    if(!confirm("Delete this story? This cannot be undone."))return;
    setStories(prev=>{
      const order=prev.order.filter(x=>x!==id),byId={...prev.byId};
      delete byId[id];
      if(id===activeStoryId){
        setActiveStoryId(order[0]);setActiveSectionId(null);
      }
      return{order,byId};
    });
  };

  if(!loaded)return <div style={baseApp(C)}>Loading your stories…</div>;
  if(!story)return null;
  const draft=story.drafts.byId[story.activeDraftId];

  return <div style={baseApp(C)}>
    {sidebarOpen&&<Sidebar C={C} stories={stories} activeStoryId={activeStoryId}
      setActiveStoryId={id=>{setActiveStoryId(id);setActiveSectionId(null)}}
      newStory={newStory} deleteStory={deleteStory} saveState={saveState}
      onClose={()=>setSidebarOpen(false)}/>}
    <main style={S.main}>
      <TopBar C={C} story={story} draft={draft} view={view} setView={setView}
        updateStory={updateStory} sidebarOpen={sidebarOpen} setSidebarOpen={setSidebarOpen}
        railOpen={railOpen} setRailOpen={setRailOpen} darkMode={darkMode}
        setDarkMode={setDarkMode} dailyWords={dailyWords} onBackup={()=>setBackupOpen(true)} onSearch={()=>setSearchOpen(true)}/>
      {view==="edit"
        ?<EditView C={C} story={story} draft={draft} updateStory={updateStory}
          recordWords={recordWords}
          activeSectionId={activeSectionId} setActiveSectionId={setActiveSectionId}
          railOpen={railOpen}/>
        :<FinalView C={C} story={story} draft={draft}/>}
    </main>
    {backupOpen&&<BackupPanel C={C} stories={stories} backups={backups} onClose={()=>setBackupOpen(false)} onRefresh={()=>dbAll(BACKUP_STORE).then(x=>setBackups(x.sort((a,b)=>b.timestamp-a.timestamp)))} onRestore={item=>{if(!confirm("Restore this backup? An emergency backup will be created first."))return;createBackup(stories,"Emergency backup before restore").then(()=>{setStories(clone(item.stories));setActiveStoryId(item.stories.order[0]);setActiveSectionId(item.stories.byId[item.stories.order[0]].sections.order[0]);setBackupOpen(false);});}}/>}
    {searchOpen&&<SearchPanel C={C} stories={stories} activeStoryId={activeStoryId} setStories={setStories} onClose={()=>setSearchOpen(false)}/>}
  </div>;
}

function Sidebar({C,stories,activeStoryId,setActiveStoryId,newStory,deleteStory,saveState,onClose}){
  const label=saveState==="saving"?"Saving…":saveState==="error"?"Save failed — storage may be full or disabled":"Saved on this device";
  const color=saveState==="error"?C.danger:saveState==="saving"?C.inkSoft:C.moss;
  return <aside style={S.sidebar(C)}>
    <div style={S.sidebarHeader}>
      <div><span style={S.brandMark(C)}>§</span><span style={S.brandText(C)}>Manuscript</span></div>
      <button style={S.smallBtn(C)} onClick={onClose}>‹</button>
    </div>
    <button style={S.newBtn(C)} onClick={newStory}>+ New story</button>
    <div style={S.storyList}>
      {stories.order.map(id=>{
        const s=stories.byId[id],active=id===activeStoryId;
        return <div key={id} onClick={()=>setActiveStoryId(id)} style={S.storyItem(C,active)}>
          <div style={S.row}><div style={S.storyTitle}>{s.title||"Untitled Story"}</div>
          {stories.order.length>1&&<button style={S.iconBtn(C)} onClick={e=>{e.stopPropagation();deleteStory(id)}}>×</button>}</div>
          <div style={S.meta(C)}>{s.drafts.order.length} draft{s.drafts.order.length!==1?"s":""}</div>
        </div>;
      })}
    </div>
    <div style={S.save(C)}><span style={{...S.dot,background:color}}/><span style={{fontSize:11,color}}>{label}</span></div>
  </aside>;
}

function WritingTimer({C}){
  const [seconds,setSeconds]=useState(()=>{
    try{return Math.max(0,Number(localStorage.getItem("manuscript:session-seconds")||0))}catch(e){return 0}
  });
  const [running,setRunning]=useState(false);
  const timerRef=useRef(null);

  useEffect(()=>{
    if(!running)return;
    timerRef.current=setInterval(()=>setSeconds(v=>v+1),1000);
    return()=>clearInterval(timerRef.current);
  },[running]);

  useEffect(()=>{
    try{localStorage.setItem("manuscript:session-seconds",String(seconds))}catch(e){}
  },[seconds]);

  const h=Math.floor(seconds/3600),m=Math.floor((seconds%3600)/60),s=seconds%60;
  const display=[h,m,s].map((x,i)=>i===0?String(x):String(x).padStart(2,"0")).join(":");
  return <div style={S.timerBox(C)} title="Session writing timer">
    <span style={S.timerLabel(C)}>SESSION</span>
    <b style={S.timerValue(C)}>{display}</b>
    <button style={S.timerBtn(C)} onClick={()=>setRunning(v=>!v)}>{running?"Pause":"Start"}</button>
    <button style={S.timerReset(C)} onClick={()=>{setRunning(false);setSeconds(0)}}>Reset</button>
  </div>;
}

function TopBar({C,story,draft,view,setView,updateStory,sidebarOpen,setSidebarOpen,railOpen,setRailOpen,darkMode,setDarkMode,dailyWords,onBackup,onSearch}){
  const [editing,setEditing]=useState(false),[title,setTitle]=useState(story.title);
  const [installPrompt,setInstallPrompt]=useState(null);
  const [online,setOnline]=useState(()=>navigator.onLine);
  const [editingDraft,setEditingDraft]=useState(null),[draftName,setDraftName]=useState("");
  const [menu,setMenu]=useState(null);
  const [menusCollapsed,setMenusCollapsed]=useState(false);
  useEffect(()=>setTitle(story.title),[story.id,story.title]);
  useEffect(()=>{
    const onPrompt=e=>{e.preventDefault();setInstallPrompt(e)};
    const onInstalled=()=>setInstallPrompt(null);
    const onOnline=()=>setOnline(true),onOffline=()=>setOnline(false);
    window.addEventListener("beforeinstallprompt",onPrompt);
    window.addEventListener("appinstalled",onInstalled);
    window.addEventListener("online",onOnline);
    window.addEventListener("offline",onOffline);
    return()=>{window.removeEventListener("beforeinstallprompt",onPrompt);window.removeEventListener("appinstalled",onInstalled);window.removeEventListener("online",onOnline);window.removeEventListener("offline",onOffline)};
  },[]);
  const installApp=async()=>{
    if(!installPrompt){alert("If Install is not offered here, open Manuscript from Chrome over HTTPS or localhost, then use Chrome’s ⋮ menu → Install app / Add to Home screen.");return;}
    installPrompt.prompt();
    await installPrompt.userChoice;
    setInstallPrompt(null);
  };
  const commitTitle=()=>{updateStory(s=>{s.title=title.trim()||"Untitled Story";return s});setEditing(false)};
  const addDraft=()=>{updateStory(s=>{const id=uid(),base=s.drafts.byId[s.activeDraftId],num=s.drafts.order.length+1;s.drafts.byId[id]={id,name:`Draft ${num}`,createdAt:now(),selections:{...base.selections}};s.drafts.order.push(id);s.activeDraftId=id;return s})};
  const startRenameDraft=id=>{setEditingDraft(id);setDraftName(story.drafts.byId[id]?.name||"")};
  const commitDraft=()=>{if(!editingDraft)return;updateStory(s=>{const d=s.drafts.byId[editingDraft];if(d)d.name=draftName.trim()||d.name||"Untitled Draft";return s});setEditingDraft(null)};
  const deleteDraft=id=>{updateStory(s=>{if(s.drafts.order.length<=1)return s;s.drafts.order=s.drafts.order.filter(x=>x!==id);delete s.drafts.byId[id];if(s.activeDraftId===id)s.activeDraftId=s.drafts.order[0];return s})};
  const closeMenus=()=>setMenu(null);
  return <header style={S.top(C)} onClick={e=>{if(e.target===e.currentTarget)closeMenus()}}>
    <div style={{...S.titleRow,alignItems:"center",gap:10,position:"relative"}}>
      {!menusCollapsed&&<>
        {sidebarOpen
          ? <button style={S.outline(C)} onClick={()=>setSidebarOpen(false)}>Stories</button>
          : <button style={S.outline(C)} onClick={()=>setSidebarOpen(true)}>☰ Stories</button>}
        <button style={S.outline(C)} onClick={()=>setRailOpen(!railOpen)}>{railOpen?"Sections":"› Sections"}</button>
      </>}
      {editing?<input autoFocus value={title} onChange={e=>setTitle(e.target.value)} onBlur={commitTitle} onKeyDown={e=>e.key==="Enter"&&commitTitle()} style={S.titleInput(C)}/>:<h1 style={S.title(C)} onClick={()=>setEditing(true)}>{story.title}</h1>}
      <div style={{...S.toggle(C),marginLeft:"auto",flexShrink:0}}>
        <button style={S.toggleBtn(C,view==="edit")} onClick={()=>{setView("edit");closeMenus()}}>Edit</button>
        <button style={S.toggleBtn(C,view==="final")} onClick={()=>{setView("final");closeMenus()}}>Read final</button>
      </div>
    </div>

    <div style={{...S.utilityRow,justifyContent:"flex-end",alignItems:"center",gap:8,marginTop:8,overflowX:"auto",paddingBottom:2}}>
      <WritingTimer C={C}/>
      {!menusCollapsed&&<>
        <div style={S.dailyBox(C)}><span style={S.timerLabel(C)}>TODAY</span><b>{dailyWords.toLocaleString()}</b><span style={S.meta(C)}>words added</span></div>
        <button style={S.outline(C)} onClick={onBackup}>🛡 Safety ▾</button>
        <div style={{position:"relative",flexShrink:0}}>
          <button style={S.outline(C)} onClick={()=>setMenu(menu==="tools"?null:"tools")}>⚙ Tools ▾</button>
          {menu==="tools"&&<div style={{...S.menuDrop(C),right:0,left:"auto"}}>
            <button style={S.menuItem(C)} onClick={()=>{onSearch();closeMenus()}}>⌕ Search &amp; Find / Replace</button>
            <button style={S.menuItem(C)} onClick={()=>{setDarkMode(!darkMode);closeMenus()}}>{darkMode?"☀ Light mode":"☾ Dark mode"}</button>
            <button style={S.menuItem(C)} onClick={()=>{window.print();closeMenus()}}>🖨 Print</button>
            <div style={{height:1,background:C.rule,margin:"4px 0"}}/>
            <button style={S.menuItem(C)} onClick={()=>{installApp();closeMenus()}}>📲 Install Manuscript</button>
            <div style={{padding:"7px 10px",fontFamily:"monospace",fontSize:9.5,color:C.inkSoft}}>● {online?"Online · offline shell cached when available":"Offline mode"}</div>
          </div>}
        </div>
      </>}
      <button
        style={{...S.outline(C),padding:"6px 9px",fontSize:18,lineHeight:1,flexShrink:0}}
        title={menusCollapsed?"Show menu":"Collapse menu"}
        aria-label={menusCollapsed?"Show menu":"Collapse menu"}
        onClick={()=>{setMenusCollapsed(v=>!v);closeMenus()}}
      >☰</button>
    </div>

function SectionWorkspace({C,story,draft,section,updateStory,recordWords,wide}){
  const selected=draft.selections[section.id];

  const [compare,setCompare]=useState(null),[restoreOpen,setRestoreOpen]=useState(null);

  const ensure=v=>{if(!history.current[v])history.current[v]={past:[],future:[],baseline:section.variants.byId[v]?.text||"",last:section.variants.byId[v]?.text||"",lastTyped:0};return history.current[v];};
  useEffect(()=>{const v=draft.selections[section.id];setText(section.variants.byId[v]?.text||"");setDirty(false);setStatus(section.status||"Draft");ensure(v);},[section.id,draft.selections[section.id],section.status]);
  useEffect(()=>setName(section.name),[section.id,section.name]);
  const checkpoint=v=>{const h=ensure(v),cur=textRef.current;if(h.last===cur)return;h.past.push(h.last);if(h.past.length>HISTORY_LIMIT)h.past.shift();h.future=[];h.last=cur;h.lastTyped=now();};
  const schedule=v=>{clearTimeout(timer.current);timer.current=setTimeout(()=>checkpoint(v),40000);};
  const changeText=next=>{const old=textRef.current;const delta=Math.max(0,countWords(next)-countWords(old));if(delta)recordWords(delta);setText(next);setDirty(true);const h=ensure(selected);h.lastTyped=now();schedule(selected);if(now()-(h.lastCheckpoint||0)>=300000){checkpoint(selected);h.lastCheckpoint=now();}};
  const undo=()=>{clearTimeout(timer.current);const h=ensure(selected),cur=textRef.current;if(h.last!==cur)checkpoint(selected);const prev=h.past.length?h.past.pop():h.baseline;if(prev===cur)return;h.future.push(cur);h.last=prev;setText(prev);setDirty(true);};
  const redo=()=>{const h=ensure(selected);if(!h.future.length)return;const cur=textRef.current,next=h.future.pop();h.past.push(cur);h.last=next;setText(next);setDirty(true);};
  const commitName=()=>{updateStory(s=>{s.sections.byId[section.id].name=name.trim()||"Untitled section";return s});setNameEdit(false);};
  const saveNew=()=>{if(!dirty)return;updateStory(s=>{const id=uid(),sec=s.sections.byId[section.id];sec.variants.byId[id]={id,text:textRef.current,createdAt:now(),note:"",restoredFrom:null};sec.variants.order.push(id);s.drafts.byId[draft.id].selections[section.id]=id;return s});setDirty(false);};
  const overwrite=()=>{if(!dirty)return;updateStory(s=>{s.sections.byId[section.id].variants.byId[selected].text=textRef.current;return s});const h=ensure(selected);h.past=[];h.future=[];h.last=textRef.current;setDirty(false);};
  const choose=v=>{if(dirty&&!confirm("You have unsaved changes. Discard them?"))return;clearTimeout(timer.current);updateStory(s=>{s.drafts.byId[draft.id].selections[section.id]=v;return s});};
  const del=v=>updateStory(s=>{const sec=s.sections.byId[section.id];if(sec.variants.order.length<=1)return s;sec.variants.order=sec.variants.order.filter(x=>x!==v);delete sec.variants.byId[v];s.drafts.order.forEach(d=>{if(s.drafts.byId[d].selections[section.id]===v)s.drafts.byId[d].selections[section.id]=sec.variants.order[0]});return s});
  const commitNote=v=>{updateStory(s=>{s.sections.byId[section.id].variants.byId[v].note=note.trim();return s});setEditingNote(null);};
  const restoreVersion=v=>{const source=section.variants.byId[v];updateStory(s=>{const sec=s.sections.byId[section.id],id=uid();sec.variants.byId[id]={id,text:source.text,createdAt:now(),note:`Restored from Version ${sec.variants.order.indexOf(v)+1}`,restoredFrom:v};sec.variants.order.push(id);s.drafts.byId[draft.id].selections[section.id]=id;return s});setRestoreOpen(null);};
  const setSectionStatus=v=>{setStatus(v);updateStory(s=>{s.sections.byId[section.id].status=v;return s});};
  const h=ensure(selected),canUndo=!!(h.past.length||(dirty&&h.last!==text)),canRedo=!!h.future.length,words=countWords(text);
  return <section style={S.workspace(C)}><div style={{...S.workspaceInner,...(wide?S.wide:{})}}>
    <div style={S.workspaceHeader}>{nameEdit?<input autoFocus value={name} onChange={e=>setName(e.target.value)} onBlur={commitName} onKeyDown={e=>e.key==="Enter"&&commitName()} style={S.sectionInput(C)}/>:<h2 style={S.sectionName(C)} onClick={()=>setNameEdit(true)}>{section.name}</h2>}<span style={S.meta(C)}>in {draft.name} · version {section.variants.order.indexOf(selected)+1} of {section.variants.order.length}</span><select value={status} onChange={e=>setSectionStatus(e.target.value)} style={S.statusSelect(C)}><option>Draft</option><option>In Progress</option><option>Final</option></select></div>
    <div style={S.editorTools(C)}><button disabled={!canUndo} style={S.historyBtn(C,canUndo)} onClick={undo}>↶ Undo</button><button disabled={!canRedo} style={S.historyBtn(C,canRedo)} onClick={redo}>↷ Redo</button><span style={S.historyInfo(C)}>This version · checkpoint after 40s of inactivity</span></div>
    <textarea style={S.textarea(C)} value={text} onChange={e=>changeText(e.target.value)} placeholder="Write this section…" spellCheck/><div style={S.wordCount(C)}>{words} word{words!==1?"s":""}</div>
    <div style={S.actionRow}><button style={S.primary(C,dirty)} disabled={!dirty} onClick={saveNew}>Save as new version</button><button style={S.ghost(C,dirty)} disabled={!dirty} onClick={overwrite}>Overwrite this version</button>{dirty&&<span style={S.meta(C)}>Unsaved changes</span>}</div>
    <div style={{marginTop:30}}><div style={S.heading(C)}>Version history for this section</div>{section.variants.order.map((vId,i)=>{const v=section.variants.byId[vId],active=vId===selected;return <div key={vId} style={S.versionRow}><div style={S.track(C)}><div style={S.dot(C,active)}/>{i<section.variants.order.length-1&&<div style={S.line(C)}/>}</div><div style={S.card(C,active)}><div onClick={()=>choose(vId)}><div style={S.cardTop}><b>Version {i+1}</b><span style={S.meta(C)}>{fmtTime(v.createdAt)}</span></div><div style={S.preview(C)}>{v.text?truncate(v.text,160):"(empty)"}</div></div><div style={S.cardBottom}>{editingNote===vId?<div style={S.noteEditor}><input autoFocus value={note} onChange={e=>setNote(e.target.value)} onClick={e=>e.stopPropagation()} onKeyDown={e=>e.key==="Enter"&&commitNote(vId)} placeholder="Add a note…" style={S.noteInput(C)}/><button style={S.miniAction(C)} onClick={e=>{e.stopPropagation();commitNote(vId)}}>Save</button><button style={S.miniAction(C)} onClick={e=>{e.stopPropagation();setEditingNote(null)}}>Cancel</button></div>:<button style={S.note(C)} onClick={e=>{e.stopPropagation();setEditingNote(vId);setNote(v.note||"")}}>{v.note||"＋ Add/edit note"}</button>}<div style={S.versionActions}><button style={S.miniAction(C)} onClick={e=>{e.stopPropagation();setCompare(vId)}}>Compare</button><button style={S.miniAction(C)} onClick={e=>{e.stopPropagation();setRestoreOpen(vId)}}>Restore</button>{section.variants.order.length>1&&<button style={S.deleteText(C)} onClick={e=>{e.stopPropagation();del(vId)}}>Delete</button>}</div></div></div></div>})}</div>
    {compare&&<CompareDialog C={C} section={section} selected={selected} other={compare} onClose={()=>setCompare(null)}/>} {restoreOpen&&<RestoreDialog C={C} versionNumber={section.variants.order.indexOf(restoreOpen)+1} onClose={()=>setRestoreOpen(null)} onRestore={()=>restoreVersion(restoreOpen)}/>}</div></section>;
}

function assemble(story,draft){
  return story.sections.order.map(id=>{
    const sec=story.sections.byId[id],v=sec.variants.byId[draft.selections[id]];
    return{name:sec.name,text:v?.text||""};
  });
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function safeName(s){return s.replace(/[^\w\- ]/g,"").trim()||"story"}
function download(content,name,mime){
  const b=new Blob([content],{type:mime}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
}
function exportText(story,draft){
  download(`${story.title}\n${draft.name} — exported ${fmtTime(now())}\n\n${assemble(story,draft).map(x=>x.text).join("\n\n")}\n`,

function exportWord(story,draft){

  </style></head><body><h1>${esc(story.title)}</h1><p>${esc(draft.name)} · exported ${fmtTime(now())}</p>${body}

</body></html>`;
  download(html,safeName(story.title)+".doc","application/msword");

function exportPdf(story,draft){

  <style>@page{margin:2cm}body{font-family:Georgia,serif;max-width:700px;margin:auto}h1{font-size:26pt}p{font-size:12pt;line-height:1.7;margin:0 0 16pt}</style>
  </head><body><h1>${esc(story.title)}</h1><p>${esc(draft.name)} · exported ${fmtTime(now())}</p>${body}</body></html>`;
  const w=open("","_blank");

  w.document.write(html);w.document.close();w.onload=()=>setTimeout(()=>w.print(),250);

function BackupPanel({C,stories,backups,onClose,onRefresh,onRestore}){
  const [file,setFile]=useState(null);
  const createManual=async()=>{const b=await createBackup(stories,"Manual backup");if(!b){alert("Could not create the manual backup. Please try again.");return;}onRefresh();const data={format:"Manuscript Project Backup",version:5,exportedAt:now(),stories};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=`Manuscript_manual_backup_${new Date().toISOString().replace(/[:.]/g,"-")}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);alert("Manual backup created and downloaded successfully.");};
  const download=()=>{const data={format:"Manuscript Project Backup",version:5,exportedAt:now(),stories};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=`Manuscript_manual_backup_${new Date().toISOString().replace(/[:.]/g,"-")}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
  const importFile=()=>{if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!validateProject(x.stories))throw new Error();onRestore({stories:x.stories,reason:"Imported manual backup",timestamp:x.exportedAt||now()});}catch(e){alert("Invalid Manuscript backup file.");}};r.readAsText(file);};
  return <div style={S.modalBackdrop}><div style={{...S.modal(C),maxWidth:650}}><div style={S.modalHead}><div><b>🛡 Safety &amp; History</b><div style={S.meta(C)}>Auto backups are stored locally in IndexedDB and created at most once every 20 minutes. V5 keeps the same ManuscriptDB so your V4 data can carry forward.</div></div><button style={S.iconBtn(C)} onClick={onClose}>×</button></div><div style={S.backupSection}><div style={S.backupTitle}><b>Auto Backups</b><span style={S.meta(C)}>Keeps the newest {AUTO_BACKUP_LIMIT}</span></div>{backups.length?<div style={S.backupList}>{backups.slice().sort((a,b)=>b.timestamp-a.timestamp).map(b=><div key={b.id} style={S.backupRow(C)}><div><b>{b.reason}</b><div style={S.meta(C)}>{fmtTime(b.timestamp)}</div></div><button style={S.miniAction(C)} onClick={()=>onRestore(b)}>Restore</button></div>)}</div>:<div style={S.emptySmall(C)}>No auto backups yet. They appear after saved changes settle.</div>}</div><div style={S.backupActions}><button style={S.outline(C)} onClick={createManual}>Create manual backup</button><button style={S.outline(C)} onClick={download}>Download backup file</button></div><div style={S.backupSection}><b>Restore a downloaded backup</b><div style={{marginTop:8}}><input type="file" accept=".json,application/json" onChange={e=>setFile(e.target.files?.[0]||null)}/></div><button style={{...S.primary(C,!!file),marginTop:8}} disabled={!file} onClick={importFile}>Import &amp; restore</button></div><div style={S.modalFoot}><span style={S.meta(C)}>An emergency backup is created before restoring.</span><button style={S.miniAction(C)} onClick={onClose}>Close</button></div></div></div>;
}
function SearchPanel({C,stories,activeStoryId,setStories,onClose}){
  const [query,setQuery]=useState(""),[replacement,setReplacement]=useState(""),[scope,setScope]=useState("all"),[results,setResults]=useState([]);
  useEffect(()=>{if(!query){setResults([]);return;}const q=query.toLowerCase(),out=[];stories.order.forEach(sid=>{if(scope==="active"&&sid!==activeStoryId)return;const s=stories.byId[sid];s.sections.order.forEach(secId=>{const sec=s.sections.byId[secId];sec.variants.order.forEach(vId=>{const v=sec.variants.byId[vId],text=v.text||"",hits=text.toLowerCase().split(q).length-1;if(hits)out.push({sid,secId,vId,story:s.title,section:sec.name,version:sec.variants.order.indexOf(vId)+1,hits,text});});});});setResults(out);},[query,scope,stories,activeStoryId]);
  const replaceAll=()=>{
    const findText=String(query||"");
    if(!findText||!results.length)return;
    const replacementText=String(replacement??"");
    if(!confirm(`Replace all matches in ${results.length} versions? Each change creates a new version and preserves the originals.`))return;
    const escaped=findText.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    const re=new RegExp(escaped,"gi");
    const next=clone(stories);
    let changed=0;
    results.forEach(r=>{
      if(scope==="active"&&r.sid!==activeStoryId)return;
      const story=next.byId?.[r.sid];
      const sec=story?.sections?.byId?.[r.secId];
      const original=sec?.variants?.byId?.[r.vId];
      if(!original)return;
      const originalText=String(original.text||"");
      re.lastIndex=0;
      if(!re.test(originalText)){re.lastIndex=0;return;}
      re.lastIndex=0;
      const newId=uid();
      const newText=originalText.replace(re,replacementText);
      sec.variants.byId[newId]={
        id:newId,
        text:newText,
        createdAt:now(),
        note:`Find & replace: ${findText}${replacementText?` → ${replacementText}`:""}`,
        restoredFrom:original.id
      };
      sec.variants.order.push(newId);
      story.drafts.order.forEach(did=>{
        const d=story.drafts.byId[did];
        if(d&&d.selections?.[r.secId]===r.vId)d.selections[r.secId]=newId;
      });
      changed++;
    });
    if(!changed){alert("No matches were replaced.");return;}
    setStories(next);
    setQuery("");
    setReplacement("");
    alert(`Replaced ${changed} version${changed!==1?"s":""}. Original versions were preserved.`);
  };

  return <div style={S.modalBackdrop}><div style={{...S.modal(C),maxWidth:780}}><div style={S.modalHead}><div><b>⌕ Search &amp; Find / Replace</b><div style={S.meta(C)}>Searches every section and every version.</div></div><button style={S.iconBtn(C)} onClick={onClose}>×</button></div><div style={S.searchFields}><input autoFocus value={query} onChange={e=>setQuery(e.target.value)} placeholder="Find text…" style={S.searchInput(C)}/><input value={replacement} onChange={e=>setReplacement(e.target.value)} placeholder="Replace with…" style={S.searchInput(C)}/><select value={scope} onChange={e=>setScope(e.target.value)} style={S.statusSelect(C)}><option value="all">All stories</option><option value="active">Active story</option></select><button disabled={!results.length} style={S.primary(C,!!results.length)} onClick={replaceAll}>Replace all</button></div><div style={{margin:"10px 0"}}>{query?<span style={S.meta(C)}>{results.length} version{results.length!==1?"s":""} contain “{query}”.</span>:<span style={S.meta(C)}>Type a search term to begin.</span>}</div><div style={S.searchResults}>{results.slice(0,100).map((r,i)=><div key={r.sid+r.vId+i} style={S.resultRow(C)}><b>{r.story}</b><div style={S.meta(C)}>{r.section} · Version {r.version} · {r.hits} match{r.hits!==1?"es":""}</div><div style={S.preview(C)}>{truncate(r.text,180)}</div></div>)}</div></div></div>;
}

function FinalView({C,story,draft}){
  return <section style={S.finalWrap(C)}><article style={S.finalPaper}>

const S={

const root=ReactDOM.createRoot(document.getElementById("root"));
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={error:null}}
  static getDerivedStateFromError(error){return{error}}
  render(){
    if(this.state.error)return <div style={{padding:24,fontFamily:"monospace",whiteSpace:"pre-wrap"}}><b>Something broke while rendering.</b><br/><br/>{String(this.state.error?.message||this.state.error)}</div>;
    return this.props.children;
  }
}
root.render(<ErrorBoundary><StoryApp/></ErrorBoundary>);

}
